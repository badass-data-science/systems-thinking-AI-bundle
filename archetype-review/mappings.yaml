# Proposed mapping from each archetype card's neutral variable names to the
# book's own causal loop diagram source (copies in archetype-review/cld/).
#
# This file is a PROPOSAL written by the agent that wrote the cards. Judging
# whether each rename keeps the book's meaning is the human part of the review.
# tools/review_archetypes.py checks everything else mechanically.
#
#   card variable: book (.cld) variable
#
# A book variable left out of a mapping is reported as "book only".

accidental-adversaries:
  figure: ch15-img3-accidental-adversaries.png
  sources:
    - cld: accidental-adversaries.cld
      map:
        "A's success": mining success
        "A's contribution to B": on-spec ore delivered
        "B's success": assembly success
        "B's contribution to A": steady orders for mining
        "A's local fix": shipment rushing
        "B's local fix": extra inspection

attractiveness-principle:
  figure: ch14-img2-attractiveness-principle.png
  sources:
    - cld: attractiveness-principle.cld
      map:
        size: headcount
        performance: heist success rate
        attractiveness: Lab attractiveness to recruits
        new arrivals: new hires
        support per member: training time per henchman
        crowding: bunk crowding
        outside scrutiny: Interpol attention level

drift-to-low-performance:
  figure: ch15-img2-drift-to-low-performance.png
  sources:
    - cld: drift-to-low-performance.cld
      map:
        gap below target: gap below target
        corrective action: corrective action
        actual performance: actual heist success rate
        pressure to lower target: pressure to lower the target
        target: heist success target

escalation:
  figure: ch12-img1-escalation-cld.png
  sources:
